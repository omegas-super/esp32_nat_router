name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.4.24)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            sdkconfig_defaults: sdkconfig.defaults
            build_dir: build_esp32
            out_dir: firmware_esp32
          - target: esp32c3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.defaults.esp32c3
            build_dir: build_esp32c3
            out_dir: firmware_esp32c3
          - target: esp32c6
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.defaults.esp32c6
            build_dir: build_esp32c6
            out_dir: firmware_esp32c6

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          command: >-
            idf.py
            -B ${{ matrix.build_dir }}
            -D SDKCONFIG_DEFAULTS="${{ matrix.sdkconfig_defaults }}"
            build

      - name: Collect release files
        run: |
          mkdir -p "${{ matrix.out_dir }}"
          cp "${{ matrix.build_dir }}/esp32_nat_router.bin" "${{ matrix.out_dir }}/"
          cp "${{ matrix.build_dir }}/bootloader/bootloader.bin" "${{ matrix.out_dir }}/"
          cp "${{ matrix.build_dir }}/partition_table/partition-table.bin" "${{ matrix.out_dir }}/"
          cp "${{ matrix.build_dir }}/ota_data_initial.bin" "${{ matrix.out_dir }}/"
          {
            echo "ESP32 NAT Router Build Information"
            echo "================================="
            echo "Target: ${{ matrix.target }}"
            echo "Build Time: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "Git Hash: ${GITHUB_SHA:0:7}"
            echo "Binary Files: 4"
            echo "Build Directory: ${{ matrix.build_dir }}"
          } > "${{ matrix.out_dir }}/build_info.txt"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.out_dir }}/esp32_nat_router.bin
            ${{ matrix.out_dir }}/bootloader.bin
            ${{ matrix.out_dir }}/partition-table.bin
            ${{ matrix.out_dir }}/ota_data_initial.bin
            ${{ matrix.out_dir }}/build_info.txt
          fail_on_unmatched_files: true
